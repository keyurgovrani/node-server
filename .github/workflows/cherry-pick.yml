name: Cherry-pick to UAT

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: cherry-pick-uat-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

run-name: Cherry-pick ${{ github.event.pull_request.merge_commit_sha }} from ${{ github.event.pull_request.base.ref }} to uat

jobs:
  cherry-pick-to-uat:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'Cherry-pick to UAT')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com"

      - name: Get merged commit hash
        id: commit-hash
        run: echo "hash=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT

      - name: Checkout UAT branch
        run: |
          git fetch origin uat:uat
          git checkout uat
          git pull origin uat

      - name: Cherry-pick commit
        id: cherry-pick
        run: |
          COMMIT=${{ steps.commit-hash.outputs.hash }}

          # Detect number of parents
          PARENT_COUNT=$(git rev-list --parents -n 1 $COMMIT | wc -w)
          # Explanation:
          # 2 words = normal commit (sha parent)
          # 3 words = merge commit (sha parent1 parent2)

          if [ "$PARENT_COUNT" -gt 2 ]; then
            echo "Merge commit detected → using -m 1"
            PICK_CMD="git cherry-pick -m 1 $COMMIT"
          else
            echo "Normal commit detected → standard cherry-pick"
            PICK_CMD="git cherry-pick $COMMIT"
          fi

          echo "Running: $PICK_CMD"
          if $PICK_CMD; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Cherry-pick successful"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "Cherry-pick failed, checking for conflicts..."

            if git status --porcelain | grep -q "^UU"; then
              echo "Conflicts detected → aborting cherry-pick"
              git cherry-pick --abort
            fi

            exit 1
          fi

      - name: Push to UAT branch
        if: steps.cherry-pick.outputs.status == 'success'
        run: |
          git push origin uat

      - name: Create comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const commitHash = '${{ steps.commit-hash.outputs.hash }}';
            const status = '${{ steps.cherry-pick.outputs.status }}';

            let comment = '';
            if (status === 'success') {
              comment = `✅ **Auto Cherry-pick Successful**\n\nCommit \`${commitHash}\` has been automatically cherry-picked to the \`uat\` branch.`;
            } else {
              comment = `❌ **Auto Cherry-pick Failed**\n\nFailed to automatically cherry-pick commit \`${commitHash}\` to the \`uat\` branch. Manual intervention may be required.`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: comment
            });

      - name: Handle cherry-pick failure
        if: steps.cherry-pick.outputs.status == 'failed'
        run: |
          echo "Cherry-pick failed for commit ${{ steps.commit-hash.outputs.hash }}"
          echo "Manual cherry-pick may be required"
          exit 1
