name: Cherry-pick PR

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to cherry-pick (required if pr_number is not provided)'
        required: false
        type: string

      pr_number:
        description: 'PR number or link to cherry-pick (required if commit_hash is not provided)'
        required: false
        type: string

      target_branch:
        description: 'Target branch for cherry-pick'
        required: true
        type: choice
        default: 'uat'
        options:
          - uat
          - live
          - uat & live      # new — fans out to both uat and live
          - custom

      custom_target_branch:
        description: "Custom target branch name (required if 'custom' selected)"
        required: false
        type: string

  pull_request:
    types: [closed]
    branches:
      - main

# Native GitHub Actions concurrency is intentionally not used here.
# This workflow uses an explicit queue action later in the job, keyed by the resolved target branch.

permissions:
  actions: read
  contents: write
  pull-requests: write

# Dynamic run name. The turnstyle queue token is the bracketed target ([uat]/[live]),
# so a multi-target run must literally contain each target's [..] for serialization:
# - Auto (PR merge): "Cherry-pick #<pr> from <base>" + " to [uat]" / " to [live]" /
#   " to [uat] & [live]" (or nothing when no cherry-pick label is present).
# - Manual (commit):  "Cherry-pick <hash> from <ref> to [<target>]"
#   (combined 'uat & live' selection renders " to [uat] & [live]").
# - Manual (PR):      "Cherry-pick PR <pr> from <ref> to [<target>]"
#   (combined 'uat & live' selection renders " to [uat] & [live]").
run-name: >-
  ${{
    github.event_name == 'pull_request'
      && format(
          'Cherry-pick #{0} from {1}{2}',
          github.event.pull_request.number,
          github.event.pull_request.base.ref,
          (contains(github.event.pull_request.labels.*.name, 'Cherry-pick to UAT') && contains(github.event.pull_request.labels.*.name, 'Cherry-pick to Live')) && ' to [uat] & [live]'
            || contains(github.event.pull_request.labels.*.name, 'Cherry-pick to UAT') && ' to [uat]'
            || contains(github.event.pull_request.labels.*.name, 'Cherry-pick to Live') && ' to [live]'
            || ''
        )
      || (
        github.event.inputs.commit_hash != ''
          && format(
              'Cherry-pick {0} from {1}{2}',
              github.event.inputs.commit_hash,
              github.ref_name,
              github.event.inputs.target_branch == 'uat & live' && ' to [uat] & [live]'
                || github.event.inputs.target_branch == 'custom' && format(' to [{0}]', github.event.inputs.custom_target_branch)
                || format(' to [{0}]', github.event.inputs.target_branch)
            )
      )
      || format(
          'Cherry-pick PR {0} from {1}{2}',
          github.event.inputs.pr_number,
          github.ref_name,
          github.event.inputs.target_branch == 'uat & live' && ' to [uat] & [live]'
            || github.event.inputs.target_branch == 'custom' && format(' to [{0}]', github.event.inputs.custom_target_branch)
            || format(' to [{0}]', github.event.inputs.target_branch)
        )
  }}

env:
  GH_TOKEN: ${{ secrets.PAT }}

jobs:
  # Computes the list of target branches for this run and exposes it as a JSON
  # array so the cherry-pick job can fan out over it via strategy.matrix.
  # - PR merge: one entry per cherry-pick label present (uat and/or live).
  # - Manual dispatch: one entry, or two for the 'uat & live' option
  #   (custom resolved + validated here).
  prepare:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        (contains(github.event.pull_request.labels.*.name, 'Cherry-pick to UAT') ||
         contains(github.event.pull_request.labels.*.name, 'Cherry-pick to Live'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.compute.outputs.targets }}
    steps:
      - name: Compute target branches
        id: compute
        run: |
          TARGETS=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Auto path: derive targets from the cherry-pick labels present at merge.
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Cherry-pick to UAT') }}" == "true" ]]; then
              TARGETS+=("uat")
            fi
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Cherry-pick to Live') }}" == "true" ]]; then
              TARGETS+=("live")
            fi
          else
            # Manual path: a single target. Resolve + validate custom here so the
            # matrix cell downstream always receives a concrete branch name.
            TB=$(echo "${{ github.event.inputs.target_branch }}" | xargs)
            if [[ "$TB" == "custom" ]]; then
              CB=$(echo "${{ github.event.inputs.custom_target_branch }}" | xargs)
              if [[ -z "$CB" ]]; then
                echo "❌ Custom branch option selected but no custom branch name provided."
                exit 1
              fi
              TARGETS+=("$CB")
            elif [[ "$TB" == "uat & live" ]]; then
              # Combined option: fan out to both, mirroring an auto PR that carries
              # both cherry-pick labels. Matrix (fail-fast:false) keeps them independent.
              TARGETS+=("uat")
              TARGETS+=("live")
            else
              TARGETS+=("$TB")
            fi
          fi

          # Defensive: the job `if` guarantees at least one target, but never emit a
          # bare/empty element — output [] so the cherry-pick job's guard skips it.
          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "No target branches resolved."
            exit 0
          fi

          JSON=$(printf '%s\n' "${TARGETS[@]}" | jq -R . | jq -cs .)
          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "Computed targets: $JSON"

  cherry-pick:
    needs: prepare
    # Skip when prepare was skipped (no cherry-pick label) or produced no targets.
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.targets != '[]' }}
    # fail-fast:false → a uat conflict must never cancel the live cell (and vice versa).
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize and set input variables
        id: input-vars
        run: |
          # Determine source of inputs based on trigger type and set variables accordingly
          # This branching logic handles two different event contexts with different data structures
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # AUTO TRIGGER PATH: PR merged with "Cherry-pick to UAT" label
            # - COMMIT_HASH: merge commit SHA from the PR that was just merged
            # - TARGET_BRANCH: this matrix cell's target (resolved from labels by prepare)
            # - SOURCE_BRANCH: the base branch where PR was merged (typically "main")
            # - PR_NUMBER: the PR number for commenting back on the original PR
            # - TRIGGER_TYPE: tracks how workflow was triggered (for logging/commenting)
            COMMIT_HASH="${{ github.event.pull_request.merge_commit_sha }}"
            # TARGET_BRANCH: this matrix cell's target, resolved from labels by the prepare job
            TARGET_BRANCH="${{ matrix.target }}"
            SOURCE_BRANCH="${{ github.event.pull_request.base.ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TRIGGER_TYPE="auto"
          else
            # MANUAL TRIGGER PATH: workflow_dispatch with user-provided inputs
            # - COMMIT_HASH: user-provided commit SHA to cherry-pick
            # - PR_NUMBER: extracted from user input (supports multiple formats):
            #   * Plain number: "14642" → extracts "14642"
            #   * Full URL: "https://github.com/unify-apps/www/pull/14642" → extracts "14642"
            #   * URL with path: "https://github.com/unify-apps/www/pull/14642/files" → extracts "14642"
            #   * grep -oE '[0-9]+': extracts first sequence of digits (the PR number)
            # - TARGET_BRANCH: this matrix cell's target (prepare resolved custom → actual name)
            # - SOURCE_BRANCH: the branch from which workflow was manually triggered
            # - xargs: trims whitespace from user inputs to prevent errors
            COMMIT_HASH=$(echo "${{ github.event.inputs.commit_hash }}" | xargs)
            # Expand to the full 40-char SHA. People paste abbreviated hashes, and
            # `git fetch origin <sha>` reads anything shorter as a ref name and
            # fails with "couldn't find remote ref". Left as typed if unresolvable,
            # so a bogus hash still fails where it did before.
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_HASH=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_HASH" --jq .sha 2>/dev/null || echo "$COMMIT_HASH")
            fi
            PR_NUMBER=$(echo "${{ github.event.inputs.pr_number }}" | grep -oE '[0-9]+' || echo "")
            # TARGET_BRANCH: this matrix cell's target (prepare already resolved custom → real name)
            TARGET_BRANCH="${{ matrix.target }}"
            SOURCE_BRANCH=$(echo "${{ github.ref_name }}" | xargs)
            TRIGGER_TYPE="manual"
          fi

          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "trigger_type=$TRIGGER_TYPE" >> $GITHUB_OUTPUT

      - name: Resolve commit hash from PR number
        if: |
          steps.input-vars.outputs.trigger_type == 'manual' &&
          steps.input-vars.outputs.commit_hash == '' &&
          steps.input-vars.outputs.pr_number != ''
        id: resolve-commit
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = "${{ steps.input-vars.outputs.pr_number }}";
            const { owner, repo } = context.repo;

            console.log(`Fetching PR #${prNumber} details...`);

            try {
              // Fetch PR details from GitHub API
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: parseInt(prNumber)
              });

              // Validate PR was actually merged
              if (!pr.merged) {
                core.setFailed(`❌ PR #${prNumber} is not merged. Only merged PRs can be cherry-picked.`);
                return;
              }

              // Validate merge_commit_sha exists
              if (!pr.merge_commit_sha) {
                core.setFailed(`❌ PR #${prNumber} doesn't have a merge commit SHA.`);
                return;
              }

              console.log(`✅ Found merge commit: ${pr.merge_commit_sha}`);
              console.log(`   PR title: ${pr.title}`);
              console.log(`   Base branch: ${pr.base.ref}`);
              
              // Set the resolved commit hash for use in subsequent steps
              core.setOutput("commit_hash", pr.merge_commit_sha);
              core.setOutput("pr_title", pr.title);
              core.setOutput("base_branch", pr.base.ref);

            } catch (error) {
              core.setFailed(`❌ Failed to fetch PR #${prNumber}: ${error.message}`);
            }

      - name: Update commit hash with resolved value
        if: steps.resolve-commit.outputs.commit_hash != ''
        id: final-commit
        run: |
          # Override commit_hash with the resolved value from PR
          echo "commit_hash=${{ steps.resolve-commit.outputs.commit_hash }}" >> $GITHUB_OUTPUT
          echo "Using commit ${{ steps.resolve-commit.outputs.commit_hash }} from PR #${{ steps.input-vars.outputs.pr_number }}"
          echo "PR Title: ${{ steps.resolve-commit.outputs.pr_title }}"
          echo "Base Branch: ${{ steps.resolve-commit.outputs.base_branch }}"

      - name: Validate commit hash is provided
        if: steps.input-vars.outputs.trigger_type == 'manual'
        run: |
          COMMIT_HASH="${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}"

          if [[ -z "$COMMIT_HASH" ]]; then
            echo "❌ Error: Either commit_hash or pr_number must be provided."
            echo "   - Provide a commit SHA directly, OR"
            echo "   - Provide a PR number/link to cherry-pick its merge commit"
            exit 1
          fi

          echo "✅ Commit hash validated: $COMMIT_HASH"

      - name: Print final sanitized inputs
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Final Cherry-pick Configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Trigger Type:      ${{ steps.input-vars.outputs.trigger_type }}"
          echo "Source Branch:     ${{ steps.input-vars.outputs.source_branch }}"
          echo "Target Branch:     ${{ steps.input-vars.outputs.target_branch }}"
          echo ""
          echo "Commit Hash:       ${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}"

          if [[ -n "${{ steps.input-vars.outputs.pr_number }}" ]]; then
            echo "PR Number:         #${{ steps.input-vars.outputs.pr_number }}"
          fi

          if [[ -n "${{ steps.resolve-commit.outputs.pr_title }}" ]]; then
            echo "PR Title:          ${{ steps.resolve-commit.outputs.pr_title }}"
            echo "PR Base Branch:    ${{ steps.resolve-commit.outputs.base_branch }}"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Determine target branch
        id: resolved-target
        run: |
          # Target branch is already fully resolved by the prepare job (custom names
          # included). Re-export it under this step id so every downstream step can
          # keep referencing steps.resolved-target.outputs.branch unchanged.
          echo "branch=${{ matrix.target }}" >> $GITHUB_OUTPUT
          echo "Source branch (workflow triggered from): ${{ steps.input-vars.outputs.source_branch }}"
          echo "Target branch (cherry-pick destination): ${{ matrix.target }}"

      - name: Validate target branch exists
        run: |
          # Verify the target branch exists on remote before attempting cherry-pick
          # This prevents wasting time on git operations that would fail later
          # - gh api: queries the branch endpoint, so this can run before checkout,
          #   which takes `ref: <target>` and would otherwise fail there first
          # - Early exit prevents confusing error messages from git checkout/cherry-pick
          if gh api "repos/${{ github.repository }}/branches/${{ steps.resolved-target.outputs.branch }}" --silent 2>/dev/null; then
            echo "✅ Target branch exists."
          else
            echo "❌ Branch '${{ steps.resolved-target.outputs.branch }}' does not exist on remote!"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolved-target.outputs.branch }}
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          # Set Git user identity for the cherry-pick commit
          # Different event types have different data structures for user info
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Auto trigger: use the original PR author's identity
            # Format: user.id+user.login@users.noreply.github.com (GitHub's noreply email format)
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com"
          else
            # Manual trigger: use the person who manually triggered the workflow
            # Format: actor_id+actor@users.noreply.github.com
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          fi

      - name: Wait for target branch queue
        # Pinned to v3.2.3 by SHA. v3.2.4 (released 2026-05-04) added an unbounded
        # multi-status, multi-workflow paginated discovery pass that exhausts the
        # 5000 req/hr GitHub API rate limit and silently stalls for ~10-12 minutes
        # before giving up. See https://github.com/softprops/turnstyle/pull/142.
        uses: softprops/turnstyle@e565d2d86403c5d23533937e95980570545e5586 # v3.2.3
        with:
          # turnstyle creates a durable in-workflow wait instead of GitHub's lossy single-pending concurrency slot.
          # Queue by destination branch so unrelated target branches can still process in parallel.
          # queue-name must be a literal substring of the run-name (display_title) because turnstyle
          # matches via `display_title.includes(queueName)`. The bracketed "[<branch>]" token is
          # false-match-proof (a branch word like live-fix never contains "[live]") and lets a
          # multi-target run embed both "[uat]" and "[live]" in one name.
          queue-name: "[${{ steps.resolved-target.outputs.branch }}]"
          same-branch-only: false
          abort-after-seconds: 600
          poll-interval-seconds: 60

      - name: Refresh target branch and fetch the source commit
        env:
          TARGET: ${{ steps.resolved-target.outputs.branch }}
          COMMIT: ${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}
        run: |
          set -euo pipefail
          # Re-read the target tip: the queue above can hold this job while
          # another cell pushes to the same branch.
          git fetch --depth=1 origin "$TARGET"
          git checkout -B "$TARGET" FETCH_HEAD

          # depth 2, not 1: merge detection below reads $COMMIT^2, and at depth 1
          # the parents are cut off, so a merge commit reads as an ordinary one
          # and cherry-pick runs without -m 1 and fails.
          git fetch --depth=2 origin "$COMMIT"

      - name: Find associated PR for commit
        # Only run for manual triggers when commit was provided directly (not from PR input)
        # Auto triggers already have PR number from event context
        # Manual triggers with PR input already have the PR number
        # Manual triggers with commit hash need to search for the PR that contains the commit
        # This enables commenting on the original PR even when manually cherry-picking
        if: |
          steps.input-vars.outputs.trigger_type == 'manual' &&
          steps.input-vars.outputs.pr_number == ''
        id: find-pr
        uses: actions/github-script@v8
        with:
          script: |
            const commit = "${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}";
            const { owner, repo } = context.repo;

            // Query GitHub API for PRs associated with the commit
            // Returns array of PRs where this commit appears
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commit
            });

            // Take first PR if found, otherwise empty string
            // Empty string is easier to check in subsequent conditionals than undefined/null
            core.setOutput("pr_number", prs.data[0]?.number ?? "");

      - name: Detect merge type and get commits to cherry-pick
        id: detect-merge
        env:
          COMMIT: ${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}
          PR_NUMBER: ${{ steps.input-vars.outputs.pr_number || steps.find-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Detection reads commit STRUCTURE only, never the message: the subject is
          # whatever the merger typed. Each merge method leaves a footprint nobody can edit:
          #   Merge commit → two parents.
          #   Rebase       → the PR's commits copied onto main; author email, author
          #                  timestamp and subject survive verbatim, only the SHA moves.
          #   Squash       → one new commit whose author timestamp is the merge time,
          #                  so it never equals any PR commit's.
          # So: two parents = merge. Otherwise walk main's first-parent line from the
          # tip and collect commits whose (email|author time|subject) fingerprint is a
          # PR commit's: N matches = rebase, zero = squash, anything else = stop.

          if git rev-parse --verify --quiet "$COMMIT^2" >/dev/null; then
            echo "merge_type=Merge Commit" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "commit_count=1" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Merge Commit (two parents) → cherry-pick with -m 1"
            exit 0
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            # A bare commit hash with no PR behind it: nothing to fingerprint
            # against, so rebase and plain commit look the same. Pick just this one.
            echo "merge_type=Single Commit" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "commit_count=1" >> "$GITHUB_OUTPUT"
            echo "✅ No associated PR → cherry-pick the single commit"
            exit 0
          fi

          N=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.commits')
          # refs/pull/N/head outlives the branch (delete-branch-on-merge included),
          # so the PR's own commits are always fetchable. Depth N covers exactly the
          # PR range; depth N+1 on the tip covers N rebased commits plus the commit
          # before them, which the walk below must see NOT match.
          git fetch --depth="$N" origin "refs/pull/$PR_NUMBER/head:refs/remotes/pr/$PR_NUMBER"
          git fetch --depth=$((N + 1)) origin "$COMMIT"

          PR_KEYS=$(git log --first-parent -n "$N" --format='%ae|%at|%s' "refs/remotes/pr/$PR_NUMBER")
          echo "PR #$PR_NUMBER has $N commit(s):"
          sed 's/^/  /' <<<"$PR_KEYS"

          # The walk runs newest→oldest; prepending keeps PICKS oldest-first, the
          # order the commits landed on main and the order they must replay.
          PICKS=()
          while read -r SHA KEY; do
            grep -qxF -- "$KEY" <<<"$PR_KEYS" || break
            PICKS=("$SHA" ${PICKS[@]+"${PICKS[@]}"})
          done < <(git log --first-parent -n $((N + 1)) --format='%H %ae|%at|%s' "$COMMIT")
          MATCHED=${#PICKS[@]}

          if [[ "$MATCHED" -eq 0 ]]; then
            echo "merge_type=Squash and Merge" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "commit_count=1" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Squash and Merge (tip matches no PR commit) → cherry-pick $COMMIT"
          elif [[ "$MATCHED" -eq "$N" ]]; then
            COMMITS="${PICKS[*]}"
            echo "merge_type=Rebase and Merge" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
            echo "commit_count=$N" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Rebase and Merge ($N commits match PR fingerprints)"
            echo "Commits to cherry-pick: $COMMITS"
          else
            echo "❌ Matched $MATCHED of $N PR commits walking back from $COMMIT."
            echo "   The tip is not the PR's merge commit, or main's history was rewritten."
            echo "   Cherry-pick the commits by hand."
            exit 1
          fi

      - name: Cherry-pick commits to target branch
        id: cherry-pick
        env:
          MERGE_TYPE: ${{ steps.detect-merge.outputs.merge_type }}
          COMMITS: ${{ steps.detect-merge.outputs.commits }}
          COMMIT_COUNT: ${{ steps.detect-merge.outputs.commit_count }}
        run: |
          echo "Merge Type: $MERGE_TYPE"
          echo "Cherry-picking $COMMIT_COUNT commit(s): $COMMITS"
          echo ""

          PICK_FAILED=false
          PICKED=0
          SKIPPED=0

          # Cherry-pick each commit in order
          for COMMIT in $COMMITS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Cherry-picking: $COMMIT"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # MERGE COMMIT DETECTION
            # Merge commits have multiple parents and require special handling
            # - git rev-parse --verify "$COMMIT^2": checks if second parent exists
            # - ^2 notation: refers to the second parent of a commit
            # - If second parent exists: it's a merge commit, use -m 1 flag
            # - -m 1: tells git to use the first parent as the mainline (preserves merge changes)
            # - Without -m 1: git doesn't know which parent to use and cherry-pick fails
            # Check if it's a merge commit (has multiple parents)
            if git rev-parse --verify "$COMMIT^2" >/dev/null 2>&1; then
              echo "Merge commit detected → using -m 1"
              PICK_CMD="git cherry-pick -m 1 $COMMIT"
            else
              echo "Normal commit → standard cherry-pick"
              PICK_CMD="git cherry-pick $COMMIT"
            fi

            echo "Running: $PICK_CMD"
            # EXECUTE CHERRY-PICK
            # Capture success/failure status for later steps (push, comment, etc.)
            if $PICK_CMD; then
              echo "✅ Cherry-pick successful for $COMMIT"
              PICKED=$((PICKED + 1))
            elif [[ -z "$(git diff --name-only --diff-filter=U)" ]] && git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
              # No unmerged paths but the sequencer is still parked: the pick came
              # out EMPTY, i.e. the change is already on the target (someone
              # cherry-picked by hand before this run). Not a failure; skip it.
              echo "ℹ️ Empty pick: $COMMIT is already on the target branch → skipping"
              git cherry-pick --skip
              SKIPPED=$((SKIPPED + 1))
            else
              echo "❌ Cherry-pick failed for $COMMIT"
              PICK_FAILED=true

              # CONFLICT DETECTION AND CLEANUP
              # - --diff-filter=U lists every unmerged path, whatever the flavour
              #   (both-modified UU, both-added AA, deleted-by-one DU/UD). The old
              #   "^UU" grep missed add/add and left the sequencer parked.
              # - Abort cherry-pick to leave repo in clean state for manual intervention
              # - Without abort: repo stays in conflicted state, blocking other operations
              if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                echo "Conflicts detected → aborting cherry-pick"
                git cherry-pick --abort
              fi

              break
            fi
            echo ""
          done

          echo "picked_count=$PICKED" >> $GITHUB_OUTPUT
          echo "skipped_count=$SKIPPED" >> $GITHUB_OUTPUT

          if [[ "$PICK_FAILED" == "true" ]]; then
            # Cherry-pick failed - could be conflicts or other git errors
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            # Cherry-pick succeeded - set output for downstream steps
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Done: $PICKED picked, $SKIPPED already present"
          fi

      - name: Check TypeScript Types
        id: check-tsc
        if: steps.cherry-pick.outputs.status == 'success'
        continue-on-error: true
        # www runs its real tsc action here. This repo only needs a gate that can
        # pass or fail, so the push/revert paths below stay exercised.
        run: node --check index.js

      - name: Handle TypeScript check failure
        if: steps.cherry-pick.outputs.status == 'success' && steps.check-tsc.outcome == 'failure'
        run: |
          echo "❌ TypeScript type check failed after cherry-pick"
          echo ""
          echo "The cherry-picked commits introduce TypeScript errors."
          echo "Reverting cherry-picks and aborting..."
          echo ""

          # Revert exactly what this run created. Picks that came out empty made
          # no commit, so the detected count would over-reset into target history.
          PICKED="${{ steps.cherry-pick.outputs.picked_count }}"
          echo "Reverting $PICKED commit(s)..."
          if [[ "$PICKED" -gt 0 ]]; then
            git reset --hard "HEAD~$PICKED"
          fi

          echo ""
          echo "Cherry-picks reverted. The target branch remains unchanged."
          exit 1

      - name: Push to target branch
        id: push
        if: steps.cherry-pick.outputs.status == 'success' && steps.check-tsc.outcome == 'success'
        run: |
          git push origin ${{ steps.resolved-target.outputs.branch }}

      - name: Comment on PR
        # Comment on PR if we have a PR number
        # Conditions breakdown:
        # 1. always(): Run this step regardless of previous step failures
        #    - Ensures we comment on PR even if cherry-pick failed (to notify of failure)
        #    - Without this, step would be skipped if cherry-pick step failed
        # 2. pr_number != '': Check if we have a PR to comment on
        #    - Auto trigger: pr_number from event context (always present)
        #    - Manual trigger: pr_number from find-pr step (may be empty if no PR found)
        #    - Only comment if PR exists (prevents API errors from missing PR number)
        if: |
          always() &&
          (steps.input-vars.outputs.pr_number != '' || steps.find-pr.outputs.pr_number != '')
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            // Use PR number from multiple sources (priority order):
            // 1. Auto trigger: from PR event
            // 2. Manual trigger with PR input: from user input
            // 3. Manual trigger with commit: from find-pr step
            const prNumber = ${{ steps.input-vars.outputs.pr_number || steps.find-pr.outputs.pr_number }};
            const targetBranch = "${{ steps.resolved-target.outputs.branch }}";
            // Use resolved commit hash if available, otherwise use direct input
            const commitHash = "${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}";
            const cherryPickStatus = "${{ steps.cherry-pick.outputs.status }}";
            const tscCheckOutcome = "${{ steps.check-tsc.outcome }}";
            const pushOutcome = "${{ steps.push.outcome }}";
            const triggerType = "${{ steps.input-vars.outputs.trigger_type }}";
            const mergeType = "${{ steps.detect-merge.outputs.merge_type }}";
            const commitCount = "${{ steps.detect-merge.outputs.commit_count || '1' }}";
            const pickedCount = Number("${{ steps.cherry-pick.outputs.picked_count || '0' }}");
            const skippedCount = Number("${{ steps.cherry-pick.outputs.skipped_count || '0' }}");

            let comment = '';
            // Prefix indicates how workflow was triggered (helps users understand context)
            const prefix = triggerType === 'auto' ? '**Auto Cherry-pick**' : '**Manual Cherry-pick**';
            // Add merge type info for debugging
            const mergeInfo = `\nMerge type: ${mergeType}`;

            // Determine failure reason and build appropriate message
            if (cherryPickStatus === "success" && tscCheckOutcome === "success" && pushOutcome === "success") {
              const plural = (count, noun) => `${count} ${noun}${Number(count) === 1 ? '' : 's'}`;
              const commitInfo = mergeType === 'Rebase and Merge'
                ? `${plural(commitCount, 'commit')} from PR #${prNumber} ${Number(commitCount) === 1 ? 'has' : 'have'} been`
                : `Commit \`${commitHash}\` has been`;
              // Empty picks mean the change was already on the target; say so
              // instead of claiming this run landed it.
              const skipInfo = skippedCount > 0
                ? `\n\n${skippedCount} of ${plural(commitCount, 'commit')} ${skippedCount === 1 ? 'was' : 'were'} already present on \`${targetBranch}\` and skipped.`
                : '';
              comment = pickedCount === 0
                ? `✅ ${prefix}\n\nNothing to do: the change is already on the \`${targetBranch}\` branch.${mergeInfo}`
                : `✅ ${prefix}\n\n${commitInfo} successfully cherry-picked to the \`${targetBranch}\` branch.${skipInfo}${mergeInfo}`;
            } else if (cherryPickStatus === "success" && tscCheckOutcome === "success" && pushOutcome === "failure") {
              comment = `❌ ${prefix}\n\n**Push failed** after cherry-picking to the \`${targetBranch}\` branch.\n\nThe cherry-pick succeeded locally but failed to push due to stale ref (remote branch has new commits). \n\nPlease re-run the workflow to cherry-pick the commits again.`;
            } else if (cherryPickStatus === "success" && tscCheckOutcome === "failure") {
              comment = `❌ ${prefix}\n\n**TypeScript type check failed** after cherry-picking.\n\nThe cherry-picked changes introduce TypeScript errors. Cherry-pick was **reverted** and the \`${targetBranch}\` branch remains unchanged.\n\nPlease fix the TypeScript errors before cherry-picking.${mergeInfo}`;
            } else if (cherryPickStatus === "failed") {
              comment = `❌ ${prefix}\n\n**Merge conflicts detected** while cherry-picking to the \`${targetBranch}\` branch.\n\nManual intervention required to resolve conflicts.${mergeInfo}`;
            } else {
              comment = `❌ ${prefix}\n\nFailed to cherry-pick to the \`${targetBranch}\` branch. Check workflow logs for details.${mergeInfo}`;
            }

            comment += `\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            // Post comment to PR (Issues API is used for PR comments)
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: comment
            });

      - name: No associated PR found
        if: |
          steps.input-vars.outputs.trigger_type == 'manual' &&
          steps.input-vars.outputs.pr_number == '' &&
          steps.find-pr.outputs.pr_number == ''
        run: echo "ℹ️ No associated PR found for commit ${{ steps.final-commit.outputs.commit_hash || steps.input-vars.outputs.commit_hash }}."

      - name: Handle cherry-pick failure
        if: steps.cherry-pick.outputs.status == 'failed' || steps.check-tsc.outcome == 'failure'
        run: |
          echo "Cherry-pick failed"
          echo "Manual cherry-pick may be required"
          exit 1
