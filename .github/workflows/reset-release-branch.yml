name: Reset Release Branch
run-name: Reset ${{ inputs.target == 'uat' && 'main' || 'uat' }} → ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to reset (main → uat or uat → live)'
        required: true
        type: choice
        options: [uat, live]

concurrency:
  group: reset-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: reset-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Git config
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Backup, tag, release, reset
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          if [[ "$TARGET" == "uat" ]]; then
            SOURCE="main"
            PRE=(--prerelease)
          else
            SOURCE="uat"
            PRE=()
          fi

          DATE_TAG="$(date '+%d.%m.%y')"
          DATE_BACKUP_BRANCH="$(date '+%d-%b-%y' | tr '[:upper:]' '[:lower:]')"

          git fetch --prune --force origin "+refs/heads/${SOURCE}:refs/remotes/origin/${SOURCE}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" "+refs/tags/*:refs/tags/*"

          # 1. backup the pre-reset target; -N suffix until unused (concurrency
          #    group serializes same-target runs, so this push needs no --force)
          BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}"
          n=0
          while git ls-remote --heads --exit-code origin "$BACKUP" >/dev/null; do
            n=$((n + 1))
            BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}-${n}"
          done
          git push origin "refs/remotes/origin/${TARGET}:refs/heads/${BACKUP}"

          # 2. reset target := source (irreversible op first — if a branch rule
          #    blocks the force-push, no tag/release phantom is left behind)
          git push origin "refs/remotes/origin/${SOURCE}:refs/heads/${TARGET}" --force

          # 3. tag + release the SOURCE (post-reset HEAD); on collision append
          #    .01, .02, … (the bare tag is tried first). Tags the source commit,
          #    which the force-push above does not move, so notes are identical
          #    to tagging before the reset — only the failure mode differs.
          TAG="${TARGET}-${DATE_TAG}"
          if git ls-remote --tags --exit-code origin "$TAG" >/dev/null; then
            n=1
            while git ls-remote --tags --exit-code origin "${TAG}.$(printf '%02d' "$n")" >/dev/null; do
              n=$((n + 1))
            done
            TAG="${TAG}.$(printf '%02d' "$n")"
          fi

          # Pin notes range to this target's previous tag — GitHub's auto pick
          # ignores the uat-/live- prefix and mis-sorts DD.MM.YY tags. -creatordate
          # sorts lightweight tags by commit date (monotonic with reset order).
          PREV_TAG="$(git for-each-ref --count=1 --sort=-creatordate --format='%(refname:short)' "refs/tags/${TARGET}-*")"

          git tag "$TAG" "refs/remotes/origin/${SOURCE}"
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" \
            --title "$TAG reset from $SOURCE" \
            --generate-notes \
            ${PREV_TAG:+--notes-start-tag "$PREV_TAG"} \
            ${PRE[@]+"${PRE[@]}"}

          {
            echo "### Reset $SOURCE → $TARGET"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Backup branch | \`$BACKUP\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Release | $(gh release view "$TAG" --json url -q .url || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY" || true
