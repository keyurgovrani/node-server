name: Reset Release Branch
run-name: Reset ${{ inputs.target }} ← ${{ inputs.target == 'uat' && 'main' || 'uat' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to reset (uat ← main or live ← uat)'
        required: true
        type: choice
        options: [uat, live]

concurrency:
  group: reset-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch ref == target in {uat,live}
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          TARGET="${{ inputs.target }}"
          if [[ "$REF" != "uat" && "$REF" != "live" ]]; then
            echo "::error::Dispatch from the uat or live branch (got '$REF')"
            exit 1
          fi
          if [[ "$REF" != "$TARGET" ]]; then
            echo "::error::target=$TARGET but dispatched from $REF; dispatch the $TARGET reset from the $TARGET branch"
            exit 1
          fi
          echo "Guard passed: resetting '$TARGET' (dispatched from '$REF')"

  reset:
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'uat' && 'reset-uat' || 'reset-live' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Git config
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Backup, tag, release, reset
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          if [[ "$TARGET" == "uat" ]]; then
            SOURCE="main"
            PRE=(--prerelease)
          else
            SOURCE="uat"
            PRE=()
          fi

          DATE_TAG="$(date '+%d.%m.%y')"
          DATE_BACKUP_BRANCH="$(date '+%d-%b-%y' | tr '[:upper:]' '[:lower:]')"

          git fetch --prune --force origin "+refs/heads/${SOURCE}:refs/remotes/origin/${SOURCE}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" "+refs/tags/*:refs/tags/*"

          # 1. backup the pre-reset target; -N suffix until unused (concurrency
          #    group serializes same-target runs, so this push needs no --force)
          BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}"
          n=0
          while git ls-remote --heads --exit-code origin "$BACKUP" >/dev/null 2>&1; do
            n=$((n + 1))
            BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}-${n}"
          done
          git push origin "refs/remotes/origin/${TARGET}:refs/heads/${BACKUP}"

          # 2. tag + GitHub release, anchored to SOURCE not the pre-reset
          #    TARGET — GitHub sorts the Releases page by the tagged commit's
          #    date, so a stale TARGET commit mis-orders releases. collision -> .NN
          TAG="${TARGET}-${DATE_TAG}"
          if git ls-remote --tags --exit-code origin "$TAG" >/dev/null 2>&1; then
            n=1
            while git ls-remote --tags --exit-code origin "${TAG}.$(printf '%02d' "$n")" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            TAG="${TAG}.$(printf '%02d' "$n")"
          fi
          git tag "$TAG" "refs/remotes/origin/${SOURCE}"
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" \
            --title "$TAG reset from $SOURCE" \
            --notes "Reset of \`$TARGET\` from \`$SOURCE\` on $DATE_TAG. Pre-reset backup: \`$BACKUP\`." \
            --generate-notes \
            "${PRE[@]}"

          # 3. reset target := source
          git push origin "refs/remotes/origin/${SOURCE}:refs/heads/${TARGET}" --force

          {
            echo "### Reset $TARGET ← $SOURCE"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Backup branch | \`$BACKUP\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Release | $(gh release view "$TAG" --json url -q .url || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY"
