name: Reset Release Branch
run-name: Reset ${{ inputs.target == 'uat' && 'main' || 'uat' }} → ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to reset (main → uat or uat → live)'
        required: true
        type: choice
        options: [uat, live]

concurrency:
  group: reset-${{ inputs.target }}
  cancel-in-progress: false

env:
  RESET_RELEASE: ${{ secrets.PAT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: reset-release
    permissions:
      contents: write
    steps:
      # shallow is fine: every push below targets a commit the remote already
      # has, and the explicit fetch brings SOURCE/TARGET/tags (with the tag
      # commit objects the creatordate sort needs). No history required.
      - uses: actions/checkout@v5
        with:
          token: ${{ env.RESET_RELEASE }}

      - name: Set up Git config
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Backup, reset, tag
        id: reset
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          if [[ "$TARGET" == "uat" ]]; then
            SOURCE="main"
          else
            SOURCE="uat"
          fi

          DATE_TAG="$(date '+%d.%m.%y')"
          DATE_BACKUP_BRANCH="$(date '+%d-%b-%y' | tr '[:upper:]' '[:lower:]')"

          git fetch --prune --force origin "+refs/heads/${SOURCE}:refs/remotes/origin/${SOURCE}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" "+refs/tags/*:refs/tags/*"

          # 1. backup the pre-reset target; -N suffix until unused (concurrency
          #    group serializes same-target runs, so this push needs no --force)
          BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}"
          n=0
          while git ls-remote --heads --exit-code origin "$BACKUP" >/dev/null; do
            n=$((n + 1))
            BACKUP="${TARGET}-backup-${DATE_BACKUP_BRANCH}-${n}"
          done
          git push origin "refs/remotes/origin/${TARGET}:refs/heads/${BACKUP}"

          # 2. reset target := source (irreversible op first — if a branch rule
          #    blocks the force-push, no tag/release phantom is left behind)
          git push origin "refs/remotes/origin/${SOURCE}:refs/heads/${TARGET}" --force

          # 3. tag the SOURCE (post-reset HEAD); on collision append
          #    .01, .02, … (the bare tag is tried first). Tags the source commit,
          #    which the force-push above does not move, so notes are identical
          #    to tagging before the reset — only the failure mode differs.
          TAG="${TARGET}-${DATE_TAG}"
          if git ls-remote --tags --exit-code origin "$TAG" >/dev/null; then
            n=1
            while git ls-remote --tags --exit-code origin "${TAG}.$(printf '%02d' "$n")" >/dev/null; do
              n=$((n + 1))
            done
            TAG="${TAG}.$(printf '%02d' "$n")"
          fi

          # Pin notes range to this target's previous tag — GitHub's auto pick
          # ignores the uat-/live- prefix and mis-sorts DD.MM.YY tags. -creatordate
          # sorts lightweight tags by commit date (monotonic with reset order).
          PREV_TAG="$(git for-each-ref --count=1 --sort=-creatordate --format='%(refname:short)' "refs/tags/${TARGET}-*")"

          git tag "$TAG" "refs/remotes/origin/${SOURCE}"
          git push origin "refs/tags/${TAG}"

          {
            echo "source=$SOURCE"
            echo "backup=$BACKUP"
            echo "tag=$TAG"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      # Notes are generated, compressed, and size-capped before publishing: a
      # long range would otherwise blow GitHub's 125k body cap and 422. This is
      # continue-on-error because the reset above is already irreversible, and a
      # notes failure must still reach the recovery warning below. The final
      # guard step still fails the run.
      - name: Publish release notes
        id: publish_release
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ steps.reset.outputs.tag }}
          PREV_TAG: ${{ steps.reset.outputs.prev_tag }}
          SOURCE: ${{ steps.reset.outputs.source }}
        run: |
          set -euo pipefail
          ASSET="release-notes-${TAG}.md"

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            --jq .body \
            | node scripts/release-notes.mjs --tag "$TAG" --out release-body.md --raw-out "$ASSET"

          # `x && y` as a bare statement returns non-zero when x is false, which
          # set -e treats as a failure — so this needs a real if, not a one-liner.
          if [[ "$TARGET" == "uat" ]]; then
            PRE=(--prerelease)
          else
            PRE=()
          fi

          # written only when the notes were truncated; attach it in the same
          # create() call so publish either fully succeeds or fully fails.
          if [[ -f "$ASSET" ]]; then
            ASSETS=("$ASSET")
          else
            ASSETS=()
          fi

          gh release create "$TAG" \
            --title "$TAG reset from $SOURCE" \
            --notes-file release-body.md \
            ${PRE[@]+"${PRE[@]}"} \
            ${ASSETS[@]+"${ASSETS[@]}"}

      - name: Job summary
        if: steps.reset.outcome == 'success'
        env:
          TARGET: ${{ inputs.target }}
          SOURCE: ${{ steps.reset.outputs.source }}
          BACKUP: ${{ steps.reset.outputs.backup }}
          TAG: ${{ steps.reset.outputs.tag }}
        run: |
          {
            echo "### Reset $SOURCE → $TARGET"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Backup branch | \`$BACKUP\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Release | $(gh release view "$TAG" --json url -q .url 2>/dev/null || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Warn if release notes were not published
        if: steps.reset.outcome == 'success' && steps.publish_release.outcome != 'success'
        env:
          TAG: ${{ steps.reset.outputs.tag }}
          PREV_TAG: ${{ steps.reset.outputs.prev_tag }}
          SOURCE: ${{ steps.reset.outputs.source }}
        run: |
          # mirrors the live call's ${PREV_TAG:+...}: a target's first-ever tag
          # has no PREV_TAG, and the printed command must omit the flag, not
          # print it with an empty value the API would reject.
          PREV_TAG_FLAG="${PREV_TAG:+ -f previous_tag_name=$PREV_TAG}"
          # mirrors the live call's uat-only --prerelease (:121-122); this step
          # only has SOURCE in scope, and SOURCE == "main" iff TARGET == "uat".
          if [[ "$SOURCE" == "main" ]]; then
            PRERELEASE_FLAG=" --prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          {
            echo ""
            echo "> [!WARNING]"
            echo "> **Release notes were NOT published** for \`$TAG\` — the branch reset itself succeeded."
            echo "> If a draft release already exists at \`$TAG\` (e.g. a prior attempt uploaded assets but didn't finish), delete it first: \`gh release delete $TAG\`."
            echo "> Recover locally:"
            echo "> \`\`\`bash"
            echo "> gh api repos/${GITHUB_REPOSITORY}/releases/generate-notes \\"
            echo ">   -f tag_name=$TAG${PREV_TAG_FLAG} --jq .body \\"
            echo ">   | node scripts/release-notes.mjs --tag $TAG --out /tmp/body.md --raw-out /tmp/full.md"
            # \$(...) stays escaped so it runs in the operator's shell against
            # THEIR /tmp/full.md, not the runner's, when they paste this line.
            echo "> gh release create $TAG --title \"$TAG reset from $SOURCE\" --notes-file /tmp/body.md${PRERELEASE_FLAG} \$( [[ -f /tmp/full.md ]] && echo /tmp/full.md )"
            echo "> \`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if release notes were not published
        if: steps.reset.outcome == 'success' && steps.publish_release.outcome != 'success'
        run: exit 1
