name: Manual Cherry-pick

run-name: Cherry-pick ${{ github.event.inputs.commit-hash }} from ${{ github.ref_name }} to ${{ github.event.inputs.dest-branch-choice == 'custom' && github.event.inputs.custom-dest-branch || github.event.inputs.dest-branch-choice }}

on:
  workflow_dispatch:
    inputs:
      dest-branch-choice:
        description: "Choose destination branch or select 'custom'"
        required: true
        type: choice
        default: "uat"
        options:
          - uat
          - live
          - custom

      custom-dest-branch:
        description: "Enter custom destination branch name (if 'custom' selected)"
        required: false
        type: string

      commit-hash:
        description: "Commit hash to cherry-pick"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  manual-cherry-pick:
    runs-on: ubuntu-latest

    steps:

      - name: Determine destination branch
        id: branch
        run: |
          if [[ "${{ github.event.inputs.dest-branch-choice }}" == "custom" ]]; then
            if [[ -z "${{ github.event.inputs.custom-dest-branch }}" ]]; then
              echo "Custom branch option selected but no custom branch provided."
              exit 1
            fi
            echo "DEST=${{ github.event.inputs.custom-dest-branch }}" >> $GITHUB_OUTPUT
          else
            echo "DEST=${{ github.event.inputs.dest-branch-choice }}" >> $GITHUB_OUTPUT
          fi

          echo "Base branch (workflow run branch): ${{ github.ref_name }}"
          echo "Destination branch: $(echo $DEST)"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Validate destination branch exists
        run: |
          if git ls-remote --heads origin ${{ steps.branch.outputs.DEST }} \
            | grep -q "${{ steps.branch.outputs.DEST }}"; then
            echo "Destination branch exists."
          else
            echo "❌ Branch '${{ steps.branch.outputs.DEST }}' does not exist!"
            exit 1
          fi

      - name: Fetch all branches
        run: git fetch --all

      - name: Checkout destination branch
        run: |
          git checkout ${{ steps.branch.outputs.DEST }}
          git pull origin ${{ steps.branch.outputs.DEST }}

      - name: Cherry-pick commit
        id: cherry
        run: |
          COMMIT="${{ github.event.inputs.commit-hash }}"

          # Count parents — merge commits have 2 parents
          PARENT_COUNT=$(git show --pretty=%P -s $COMMIT | wc -w)

          if [ "$PARENT_COUNT" -gt 1 ]; then
            echo "Merge commit detected → using: git cherry-pick -m 1 $COMMIT"
            PICK_CMD="git cherry-pick -m 1 $COMMIT"
          else
            echo "Normal commit → using: git cherry-pick $COMMIT"
            PICK_CMD="git cherry-pick $COMMIT"
          fi

          if $PICK_CMD; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Cherry-pick successful"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "Cherry-pick failed"

            if git status --porcelain | grep -q "^UU"; then
              echo "Conflicts detected → aborting"
              git cherry-pick --abort
            fi

            exit 1
          fi

      - name: Push commit
        if: steps.cherry.outputs.status == 'success'
        run: git push origin ${{ steps.branch.outputs.DEST }}

      - name: Find PR associated with commit
        id: prlookup
        uses: actions/github-script@v7
        with:
          script: |
            const commit = "${{ github.event.inputs.commit-hash }}".trim();
            const { owner, repo } = context.repo;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commit
            });

            core.setOutput("pr", prs.data[0]?.number ?? "");

      - name: Comment on PR (if found)
        if: steps.prlookup.outputs.pr != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = ${{ steps.prlookup.outputs.pr }};
            const { owner, repo } = context.repo;
            const dest = "${{ steps.branch.outputs.DEST }}";
            const commitHash = "${{ github.event.inputs.commit-hash }}";
            const status = "${{ steps.cherry.outputs.status }}";

            let comment = '';

            if (status === "success") {
                comment = `✅ **Manual Cherry-pick Successful**\n\nCommit \`${commitHash}\` has been manually cherry-picked into the \`${dest}\` branch.`;
            } else {
                comment = `❌ **Manual Cherry-pick Failed**\n\nFailed to manually cherry-pick commit \`${commitHash}\` into the \`${dest}\` branch due to conflicts. Manual intervention may be required.`;
            }

            await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body: comment
            });

      - name: No PR found
        if: steps.prlookup.outputs.pr == ''
        run: echo "ℹ️ No PR found for commit."

      - name: Fail workflow if cherry-pick failed
        if: steps.cherry.outputs.status == 'failed'
        run: exit 1
